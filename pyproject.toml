[project]
name = "paperless-tax-export"
version = "0.1.0"
description = "Read-only export of one financial year from Paperless-ngx to accountant-ready CSVs."
readme = "README.md"
requires-python = ">=3.14"
# Deliberately empty pending the Paperless client (httpx, pydantic) in a later stage.
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
paperless-tax-export = "paperless_tax_export.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-socket>=0.8.1",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-socket"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
