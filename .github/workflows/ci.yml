name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  enable-cache: true

            - name: Check Dockerfile Python matches .python-version
              run: |
                  expected="$(tr -d '[:space:]' < .python-version)"
                  actual="$(sed -n 's/^FROM python:\([0-9]*\.[0-9]*\).*/\1/p' Dockerfile)"
                  if [ "$expected" != "$actual" ]; then
                      echo "Dockerfile uses Python '$actual' but .python-version is '$expected'" >&2
                      exit 1
                  fi

            - name: Install dependencies
              run: uv sync --locked

            - name: Ruff lint
              run: uv run ruff check

            - name: Ruff format
              run: uv run ruff format --check

            - name: Mypy
              run: uv run mypy

            - name: Pytest
              run: uv run pytest
