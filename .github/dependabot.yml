version: 2
updates:
    - package-ecosystem: 'uv'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'sunday'
          time: '16:00'
      groups:
          python-dependencies:
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'docker'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'sunday'
          time: '16:00'
      ignore:
          - dependency-name: 'python'
            update-types:
                - 'version-update:semver-major'
                - 'version-update:semver-minor'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'sunday'
          time: '16:00'
      groups:
          github-actions:
              update-types:
                  - 'minor'
                  - 'patch'
